<style>
:root{
  --bg:#ffffff; --ink:#0f1a1e; --muted:#4a5a60; --line:#b9c4c8; --soft:#eef2f3;
  --bar:#14313a; --bar-ink:#ffffff;
  --exp:#a4161a; --exp-bg:#fde9e8; --inc:#156b34; --inc-bg:#e2f4e8;
  --neu:#2c4d73; --neu-bg:#e6edf6; --warn:#7a4b00; --warn-bg:#fff1cc;
  --focus:#f2b705;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 19px/1.4 Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Шапка */
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));min-height:68px}
.top h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{background:transparent;border:2px solid rgba(255,255,255,.6);color:var(--bar-ink);border-radius:10px;min-height:48px;min-width:60px;padding:6px 14px;font-weight:600;font-size:17px}
main{padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h2{font-size:24px;margin:4px 0 0}
h3{font-size:19px;margin:8px 0 0;color:var(--muted)}
.hint{color:var(--muted);font-size:17px;margin:0}

/* Главный экран */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.big{border:3px solid var(--line);border-radius:var(--r);background:var(--soft);min-height:150px;padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.big b{font-size:30px}
.big span{font-size:18px;color:var(--muted)}
.big.exp{background:var(--exp-bg);border-color:var(--exp);color:var(--exp)}
.big.inc{background:var(--inc-bg);border-color:var(--inc);color:var(--inc)}
.big.bal{background:var(--neu-bg);border-color:var(--neu);color:var(--neu)}
.bal-list{display:flex;flex-direction:column;gap:10px}
.bal-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.bal-row b{font-size:22px} .bal-row .num{font-size:24px;font-weight:700;white-space:nowrap}
.bal-total{border-color:var(--neu);background:var(--neu-bg);color:var(--neu)} .bal-total .num{font-size:30px}

/* Плитки */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{border:2px solid var(--line);background:var(--bg);border-radius:var(--r);min-height:84px;padding:12px 14px;text-align:left;font-size:19px;font-weight:600;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile small{font-weight:400;font-size:15px;color:var(--muted)}
.t-exp .tile{border-color:#e3a9a6}
.t-exp .tile:active{background:var(--exp-bg)}
.t-inc .tile{border-color:#9fcfae}
.t-inc .tile:active{background:var(--inc-bg)}
.tile.more{background:var(--soft);border-style:dashed}
.t-neu .tile{border-color:#a9bdd6}

/* Плашка выбранного */
.path{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border-radius:999px;padding:8px 16px;font-weight:600;font-size:17px;border:2px solid currentColor;background:var(--bg)}
.c-exp{color:var(--exp)} .c-inc{color:var(--inc)} .c-neu{color:var(--neu)}
.bg-exp{background:var(--exp-bg)} .bg-inc{background:var(--inc-bg)} .bg-neu{background:var(--neu-bg)}

/* Экран суммы */
.amount-layout{display:grid;gap:18px}
@media (min-width:820px){.amount-layout{grid-template-columns:1fr 1fr;align-items:start}}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-weight:700;font-size:18px}
.label em{font-style:normal;font-weight:400;color:var(--muted)}
.display{border:3px solid var(--line);border-radius:var(--r);padding:12px 16px;font-size:40px;font-weight:700;text-align:right;min-height:76px;background:var(--soft);overflow-wrap:anywhere}
.display.req{border-color:var(--exp)}
.display .cur{font-size:22px;font-weight:400;color:var(--muted);margin-left:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{min-height:68px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:30px;font-weight:600}
.key:active{background:var(--soft)}
.key.wide{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{min-height:60px;min-width:60px;padding:10px 18px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:18px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=date]{min-height:60px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:20px;background:var(--bg)}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:19px;resize:vertical}

/* Основные кнопки */
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{min-height:64px;padding:12px 24px;border-radius:var(--r);border:3px solid var(--ink);background:var(--ink);color:var(--bg);font-size:21px;font-weight:700;flex:1 1 200px}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.exp{background:var(--exp);border-color:var(--exp)}
.btn.inc{background:var(--inc);border-color:var(--inc)}
.btn.neu{background:var(--neu);border-color:var(--neu)}
.btn:disabled{background:var(--soft);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.txt{width:100%;min-height:60px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:20px;background:var(--bg)}
.txt.req{border-color:var(--exp)}
.qtyrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.qtyrow .txt{width:9em;flex:none}
.need{color:var(--exp);font-weight:600;margin:0}

/* Подтверждение */
.card{border:3px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.sum-big{font-size:46px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.rows{display:flex;flex-direction:column;gap:2px;margin:0}
.rows dt{color:var(--muted);font-size:16px;margin-top:8px} .rows dd{margin:0;font-weight:700;font-size:22px;overflow-wrap:anywhere}
.warn{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn);border-radius:12px;padding:14px;font-weight:600}

/* Результат */
.result{border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.result b{font-size:36px}
.result.ok{background:var(--inc-bg);color:var(--inc);border:3px solid var(--inc)}
.result.bad{background:var(--exp-bg);color:var(--exp);border:3px solid var(--exp)}

/* История */
.list{display:flex;flex-direction:column;gap:12px}
.item{border:2px solid var(--line);border-left-width:10px;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.item.exp{border-left-color:var(--exp)} .item.inc{border-left-color:var(--inc)} .item.neu{border-left-color:var(--neu)}
.item.off{opacity:.55}
.item .s{font-size:22px;font-weight:800;text-align:right;white-space:nowrap}
.item .m{color:var(--muted);font-size:16px;grid-column:1/-1}
.item .a{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.item .a .chip{min-height:52px}
.scroll-x{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.scroll-x .chip{flex:none}

/* Отчёты */
.tabs{display:flex;flex-wrap:wrap;gap:4px 8px;border-bottom:3px solid var(--line)}
.tab{flex:none;min-height:56px;padding:8px 16px;border:0;background:transparent;font-weight:700;font-size:18px;border-bottom:5px solid transparent;margin-bottom:-3px}
.tab[aria-selected="true"]{border-bottom-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kpi{border-radius:var(--r);padding:16px;border:3px solid var(--line)}
.kpi span{display:block;font-size:18px;font-weight:600}
.kpi b{display:block;font-size:34px;font-weight:800;overflow-wrap:anywhere}
.kpi small{display:block;color:var(--muted);font-size:15px}
.kpi.exp{border-color:var(--exp);color:var(--exp);background:var(--exp-bg)}
.kpi.inc{border-color:var(--inc);color:var(--inc);background:var(--inc-bg)}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.side div{border:2px dashed var(--line);border-radius:12px;padding:12px}
.side b{font-size:22px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.bar-row .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.bar-row .v{font-weight:700;white-space:nowrap}
.bar-track{grid-column:1/-1;height:18px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:9px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:18px}
th,td{padding:10px 8px;border-bottom:2px solid var(--soft);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--muted);font-size:16px}
.up{color:var(--exp);font-weight:700} .down{color:var(--inc);font-weight:700} /* up = плохо, down = хорошо */
.dyn{display:flex;flex-direction:column;gap:10px}
.dyn>div{border:2px solid var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.dyn .n{font-weight:700}
.dyn .p{color:var(--muted);font-size:17px}
.dates{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

/* Загрузка */
.loader{position:fixed;inset:0;background:rgba(15,26,30,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.loader div{background:var(--bg);border-radius:var(--r);padding:24px 32px;display:flex;align-items:center;gap:16px;font-size:21px;font-weight:600}
.spin{width:36px;height:36px;border:5px solid var(--soft);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
</style>
</head>

const S = { lang: load('lang') || CONFIG.DEFAULT_LANG, user: null, pin: load('pin') || '', ref: null,
  draft: null, back: null, histFilter: {}, rep: { period: 'month', tab: 'total', from: '', to: '', data: null }, busy: false };

function load(k){ try { return localStorage.getItem('uchet_' + k); } catch(e){ return null; } }
function store(k, v){ try { v == null ? localStorage.removeItem('uchet_' + k) : localStorage.setItem('uchet_' + k, v); } catch(e){} }
function t(k, vars){ let s = (T[S.lang] && T[S.lang][k]) || T.ru[k] || k; if (vars) for (const x in vars) s = s.split('{' + x + '}').join(vars[x]); return s; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ const v = Math.round(Number(n) || 0); return (v < 0 ? '−' : '') + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmtDate(s){ if (!s) return ''; const [y,m,d] = s.split('-'); return d + '.' + m + '.' + y; }
function addDays(s, n){ const d = new Date(Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10) + n)); return d.toISOString().slice(0,10); }
function newId(){ if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12); }
function typeClass(type){ return type === 'Расход' ? 'exp' : type === 'Доход' ? 'inc' : 'neu'; }
function isBoss(){ return S.user && S.user.role === 'boss'; }
function catName(a){ return S.lang === 'uz' ? a.catUz : a.cat; }
function subName(a){ return S.lang === 'uz' ? a.subUz : a.sub; }
function catLabel(type, cat){ const a = S.ref && S.ref.articles.find(x => x.type === type && x.cat === cat); return a ? catName(a) : cat; }
function payLabel(ru){ const p = S.ref && S.ref.pays.find(x => x.ru === ru); return p ? (S.lang === 'uz' ? p.uz : p.ru) : ru; }
const $app = document.getElementById('app');

/* ==========================================================
   ОБМЕН С СЕРВЕРОМ (Apps Script)
   ========================================================== */
async function api(action, extra, loadingText){
  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('ВСТАВЬТЕ') === 0) throw { code: 'ERR_CONFIG' };
  showLoader(true, loadingText);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_SEC * 1000);
  try {
    const body = Object.assign({ action, user: S.user ? S.user.name : load('user'), pin: S.pin }, extra || {});
    const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body), signal: ctrl.signal, redirect: 'follow' });
    if (!res.ok) throw { code: 'ERR_NET' };
    const j = await res.json();
    if (!j.ok) throw { code: j.error || 'ERR_DATA' };
    return j.data;
  } catch (e) {
    if (e && e.code) throw e;
    throw { code: 'ERR_NET' };
  } finally {
    clearTimeout(timer);
    showLoader(false);
  }
}
function showLoader(on, text){ document.getElementById('loader').hidden = !on; document.getElementById('loaderText').textContent = text || t('loading'); }
function errText(code){ return t(code, { m: (S.ref && S.ref.cancelMinutes) || 10 }); }

/* ==========================================================
   ОБЩАЯ РАЗМЕТКА ЭКРАНА
   ========================================================== */
function screen(title, html, backFn){
  document.getElementById('title').textContent = title;
  const b = document.getElementById('backBtn');
  S.back = backFn || null;
  b.hidden = !backFn;
  b.textContent = t('back');
  $app.innerHTML = html;
  if (S.keepScroll != null) { window.scrollTo(0, S.keepScroll); S.keepScroll = null; } else window.scrollTo(0, 0);
  const f = $app.querySelector('[data-autofocus]'); if (f) f.focus();
}
document.getElementById('backBtn').onclick = () => { if (S.back) S.back(); };
document.getElementById('langBtn').onclick = () => { S.lang = S.lang === 'ru' ? 'uz' : 'ru'; store('lang', S.lang); applyLang(); rerender(); };
function applyLang(){ document.documentElement.lang = S.lang; document.getElementById('langBtn').textContent = t('langBtn'); }
let rerender = () => {};

function showError(code, retryFn, backFn){
  rerender = () => showError(code, retryFn, backFn);
  // PIN не подходит (сменили или поставили, пока приложение было открыто) — сразу на экран входа
  if ((code === 'ERR_PIN' || code === 'ERR_NO_PIN' || code === 'ERR_USER') && S.ref) { logout(); return showLogin(); }
  screen(t('error'), `
    <div class="result bad" role="alert"><b>${esc(t('error'))}</b><p>${esc(errText(code))}</p></div>
    <div class="actions">
      ${retryFn ? `<button class="btn" id="retry" type="button">${esc(t('retry'))}</button>` : ''}
      <button class="btn ghost" id="eback" type="button">${esc(backFn ? t('back') : t('home'))}</button>
    </div>`, backFn || null);
  if (retryFn) document.getElementById('retry').onclick = retryFn;
  document.getElementById('eback').onclick = backFn || showHome;
}

/* ==========================================================
   ВХОД
   ========================================================== */
async function start(){
  applyLang();
  const saved = load('user');
  if (saved) {
    S.user = { name: saved };
    try { await doInit(); return; }
    catch (e) {
      if (e.code === 'ERR_PIN' || e.code === 'ERR_USER' || e.code === 'ERR_NO_PIN') { logout(); }
      else return showError(e.code, start);
    }
  }
  showLogin();
}
async function doInit(){
  const d = await api('init');
  S.ref = d; S.user = d.user; store('user', d.user.name); store('pin', S.pin || null);
  showHome();
}
function logout(){ S.user = null; S.pin = ''; S.ref = null; store('user', null); store('pin', null); }

async function showLogin(){
  let users;
  try { users = await api('users'); } catch (e) { return showError(e.code, showLogin); }
  rerender = () => renderLogin(users);
  renderLogin(users);
}
function renderLogin(users){
  screen(t('app'), `
    <h2>${esc(t('whoAreYou'))}</h2><p class="hint">${esc(t('whoHint'))}</p>
    <div class="tiles">${users.map((u, i) => `<button class="tile" type="button" data-i="${i}">${esc(u.name)}</button>`).join('')}</div>`);
  $app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
    const u = users[+b.dataset.i];
    S.user = { name: u.name };
    if (u.hasPin) showPin(u, users); else showNewPin(u, users);
  });
}

// Цифровая клавиатура для PIN (4 цифры). onDone(pin) вызывается после 4-й цифры.
function pinPad(title, hint, warn, backFn, onDone){
  let pin = '';
  const draw = () => {
    rerender = draw;
    screen(t('app'), `
      <h2>${esc(title)}</h2><p class="hint">${esc(hint)}</p>
      ${warn ? `<div class="warn" role="alert">${esc(warn)}</div>` : ''}
      <div class="display num" aria-live="polite" style="text-align:center;letter-spacing:.4em">${'●'.repeat(pin.length)}${'○'.repeat(4 - pin.length)}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" type="button" data-k="${n}">${n}</button>`).join('')}
        <span></span>
        <button class="key" type="button" data-k="0">0</button>
        <button class="key wide" type="button" data-k="del">${esc(t('erase'))}</button></div>`, backFn);
    $app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'del') { pin = pin.slice(0, -1); draw(); return; }
      if (pin.length >= 4) return;
      pin += k; draw();
      if (pin.length === 4) setTimeout(() => onDone(pin), 150);
    });
  };
  draw();
}

// Вход по существующему PIN
function showPin(u, users, warn){
  pinPad(u.name, t('enterPin'), warn, () => renderLogin(users), (pin) => {
    S.pin = pin;
    doInit().catch(e => {
      S.pin = '';
      if (e.code === 'ERR_PIN') showPin(u, users, t('ERR_PIN'));
      else showError(e.code, () => showPin(u, users), () => renderLogin(users));
    });
  });
}

// Первый вход: придумать PIN и повторить его
function showNewPin(u, users, warn){
  pinPad(u.name, t('newPin'), warn, () => renderLogin(users), (first) => {
    pinPad(u.name, t('repeatPin'), '', () => showNewPin(u, users), async (second) => {
      if (first !== second) return showNewPin(u, users, t('pinMismatch'));
      try {
        await api('setPin', { newPin: first }, t('saving'));
        S.pin = first;
        await doInit();
      } catch (e) {
        if (e.code === 'ERR_PIN_EXISTS') showPin(u, users, t('ERR_PIN_EXISTS'));
        else showError(e.code, () => showNewPin(u, users), () => renderLogin(users));
      }
    });
  });
}

          <div class="chips">${S.ref.pays.map(p => `<button class="chip" type="button" data-pay="${esc(p.ru)}" aria-pressed="${d.pay === p.ru}">${esc(S.lang === 'uz' ? p.uz : p.ru)}</button>`).join('')}</div>
        </div>
        ${d.type === 'Перевод' ? `<div class="field">
          <span class="label">${esc(t('payTo'))}</span>
          <div class="chips">${S.ref.pays.filter(p => p.ru !== d.pay).map(p => `<button class="chip" type="button" data-payto="${esc(p.ru)}" aria-pressed="${d.payTo === p.ru}">${esc(S.lang === 'uz' ? p.uz : p.ru)}</button>`).join('')}</div>
        </div>` : ''}
        ${showParty && S.ref.parties.length ? `<div class="field">
          <span class="label">${esc(t('party'))} <em>(${esc(t('optional'))})</em></span>
          <div class="chips"><button class="chip" type="button" data-party="" aria-pressed="${!d.party}">${esc(t('none'))}</button>
          ${S.ref.parties.map(p => `<button class="chip" type="button" data-party="${esc(p)}" aria-pressed="${d.party === p}">${esc(p)}</button>`).join('')}</div>
        </div>` : ''}
        <div class="field">
          <label class="label" for="cmt">${esc(t('comment'))} <em>(${esc(t('optional'))})</em></label>
          <textarea id="cmt" maxlength="500">${esc(d.comment)}</textarea>
          <p class="hint">${esc(t('commentHint'))}</p>
        </div>
      </div>
    </div>
    <p class="need" id="need"></p>
    <div class="actions"><button class="btn ${cls}" type="button" id="aNext">${esc(t('next'))}</button></div>`, d.pickBack);

  const disp = document.getElementById('disp'), next = document.getElementById('aNext'), need = document.getElementById('need');
  const nameInp = document.getElementById('nameInp'), qtyInp = document.getElementById('qtyInp');
  const upd = () => {
    const okSum = Number(d.digits) > 0, okName = !needName() || d.name.trim() !== '';
    disp.innerHTML = (d.digits ? money(d.digits) : '0') + `<span class="cur">${esc(t('sum'))}</span>`;
    disp.classList.toggle('req', !okSum);
    nameInp.classList.toggle('req', !okName);
    next.disabled = !(okSum && okName);
    need.textContent = !okName ? t('needName') : !okSum ? t('needAmount') : '';
    need.hidden = okSum && okName;
  };
  nameInp.oninput = () => { d.name = nameInp.value; upd(); };
  qtyInp.oninput = () => { qtyInp.value = qtyInp.value.replace(/[^0-9.,]/g, ''); d.qty = qtyInp.value; };
  $app.querySelectorAll('[data-nm]').forEach(b => b.onclick = () => {
    const n = names[+b.dataset.nm]; d.name = n.name; if (n.unit) d.unit = n.unit; keepInputs(); d.name = n.name; showAmount();
  });
  $app.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => { keepInputs(); d.unit = b.dataset.unit; redraw(); });
  upd();
  $app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'del') d.digits = d.digits.slice(0, -1);
    else { let s = (d.digits + k).replace(/^0+/, ''); if (s.length <= 11) d.digits = s; }
    upd();
  });
  $app.querySelectorAll('[data-date]').forEach(b => b.onclick = () => {
    const v = b.dataset.date;
    d.otherDate = v === 'other';
    if (v === 'today') d.date = S.ref.today; else if (v === 'yest') d.date = yest;
    keepInputs(); redraw();
  });
  document.getElementById('dateInp').onchange = (e) => { const v = e.target.value; if (v && v <= S.ref.today) d.date = v; else e.target.value = d.date; };
  $app.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { d.pay = b.dataset.pay; if (d.payTo === d.pay) d.payTo = ''; keepInputs(); redraw(); });
  $app.querySelectorAll('[data-payto]').forEach(b => b.onclick = () => { d.payTo = b.dataset.payto; keepInputs(); redraw(); });
  $app.querySelectorAll('[data-party]').forEach(b => b.onclick = () => { d.party = b.dataset.party; keepInputs(); redraw(); });
  document.getElementById('cmt').oninput = (e) => { d.comment = e.target.value; };
  document.getElementById('aChange').onclick = () => { keepInputs(); changeArticle(); };
  next.onclick = () => {
    keepInputs();
    if (d.type === 'Перевод' && (!d.payTo || d.payTo === d.pay)) return showError('ERR_PAY_TO', null, showAmount);
    if (Number(d.digits) > 0 && (!needName() || d.name.trim())) showConfirm();
  };
}
// Новое название сразу появляется в подсказках, без перезапуска приложения
function rememberName(op){
  if (!op.name) return;
  const k = op.type + '|' + op.cat + '|' + op.sub;
  S.ref.names = S.ref.names || {};
  const list = (S.ref.names[k] || []).filter(x => x.name.toLowerCase() !== op.name.toLowerCase());
  list.unshift({ name: op.name, unit: op.unit || '' });
  S.ref.names[k] = list.slice(0, 6);
}
function redraw(){ S.keepScroll = window.scrollY; showAmount(); }
function keepInputs(){
  if (!S.draft) return;
  const c = document.getElementById('cmt'), n = document.getElementById('nameInp'), q = document.getElementById('qtyInp');
  if (c) S.draft.comment = c.value; if (n) S.draft.name = n.value; if (q) S.draft.qty = q.value;
}
function payTitle(type){ return type === 'Расход' ? t('payExp') : type === 'Перевод' ? t('payFrom') : t('payInc'); }
function needName(){ return S.draft && S.draft.type === 'Расход'; }
function qtyNum(q){ const n = Number(String(q || '').replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; }
function unitLabel(ru){ const u = S.ref.units && S.ref.units.find(x => x.ru === ru); return u ? (S.lang === 'uz' ? u.uz : u.ru) : ru; }
function currentArticle(){ const d = S.draft; return S.ref.articles.find(a => a.type === d.type && a.cat === d.cat && a.sub === d.sub) || { cat: d.cat, catUz: d.cat, sub: d.sub, subUz: d.sub }; }

/* ==========================================================
   ПОДТВЕРЖДЕНИЕ И ЗАПИСЬ
   ========================================================== */
function showConfirm(){
  rerender = showConfirm;
  const d = S.draft, cls = typeClass(d.type), a = currentArticle(), amount = Number(d.digits);
  const typical = S.ref.typical[d.type + '|' + d.cat + '|' + d.sub];
  const warn = typical && amount >= typical * CONFIG.WARN_FACTOR;
  screen(d.editId ? t('editT') : t('checkT'), `
    <h2>${esc(d.editId ? t('checkEdit') : t('check'))}</h2>
    <div class="card bg-${cls}" style="border-color:var(--${cls})">
      <span class="pill c-${cls}" style="align-self:flex-start">${esc(t('T_' + d.type))}</span>
      <div class="sum-big num c-${cls}">${money(amount)} ${esc(t('sum'))}</div>
      ${d.editId && d.oldSum !== amount ? `<p class="hint num">${esc(t('wasSum'))}: ${money(d.oldSum)} ${esc(t('sum'))}</p>` : ''}
      <dl class="rows">
        ${d.name.trim() ? `<dt>${esc(d.type === 'Расход' ? t('nameExp') : t('nameInc'))}</dt><dd>${esc(d.name.trim())}</dd>` : ''}
        ${qtyNum(d.qty) ? `<dt>${esc(t('qty'))}</dt><dd class="num">${esc(String(qtyNum(d.qty)).replace('.', ','))} ${esc(unitLabel(d.unit))} · ${money(amount / qtyNum(d.qty))} ${esc(t('sum'))} ${esc(t('perUnit', { u: unitLabel(d.unit) }))}</dd>` : ''}
        <dt>${esc(t('date'))}</dt><dd>${esc(fmtDate(d.date))}</dd>
        <dt>${esc(catName(a))}</dt><dd>${esc(subName(a))}</dd>
        <dt>${esc(payTitle(d.type))}</dt><dd>${esc(payLabel(d.pay))}</dd>
        ${d.type === 'Перевод' ? `<dt>${esc(t('payTo'))}</dt><dd>${esc(payLabel(d.payTo))}</dd>` : ''}
        ${d.party ? `<dt>${esc(t('party'))}</dt><dd>${esc(d.party)}</dd>` : ''}
        ${d.comment.trim() ? `<dt>${esc(t('comment'))}</dt><dd>${esc(d.comment.trim())}</dd>` : ''}
      </dl>
    </div>
    ${warn ? `<div class="warn" role="alert">${esc(t('warnBig', { n: Math.floor(amount / typical), a: subName(a), t: money(typical) }))}</div>` : ''}
    <div class="actions">
      <button class="btn ${cls}" type="button" id="cSave">${esc(d.editId ? t('saveEdit') : t('save'))}</button>
      <button class="btn ghost" type="button" id="cFix">${esc(t('fix'))}</button>
    </div>`, showAmount);
  document.getElementById('cFix').onclick = showAmount;
  const btn = document.getElementById('cSave');
  btn.onclick = async () => {
    if (S.busy) return;               // повторное нажатие не отправит второй раз
    S.busy = true; btn.disabled = true;
    try {
      const op = { id: d.id, type: d.type, cat: d.cat, sub: d.sub, amount, date: d.date,
        pay: d.pay, payTo: d.type === 'Перевод' ? d.payTo : '', party: d.party, comment: d.comment.trim(), name: d.name.trim(),
        qty: qtyNum(d.qty) ? String(qtyNum(d.qty)) : '', unit: qtyNum(d.qty) ? d.unit : '' };
      if (d.editId) { await api('edit', { id: d.editId, op }, t('saving')); rememberName(op); showEdited(); }
      else { const r = await api('add', { op }, t('saving')); rememberName(op); showSaved(r.duplicate); }
    } catch (e) {
      // тот же ID: если первая попытка всё же дошла, сервер не создаст дубль
      showError(e.code, () => showConfirm(), showConfirm);
    } finally { S.busy = false; }
  };
}

function renderHistory(){

  const catList = cats(f.type || 'Расход').concat(f.type ? [] : cats('Доход'));

  screen(t('history'), `
    ${types.length ? `<div class="scroll-x" role="group">
      <button class="chip" type="button" data-ft="" aria-pressed="${!f.type}">${esc(t('all'))}</button>

    <div class="list">

          <div>${o.name ? `<b>${esc(o.name)}</b>${o.qty ? ` · <span class="num">${esc(String(o.qty).replace('.', ','))} ${esc(unitLabel(o.unit))}</span>` : ''}<br><span class="hint">${esc(catLabel(o.type, o.cat))} → ${esc(subLabel(o))}</span>` : `<b>${esc(catLabel(o.type, o.cat))}</b> → ${esc(subLabel(o))}`}</div>
          <div class="s num c-${c}">${o.type === 'Расход' ? '−' : ''}${money(o.sum)}</div>
          <div class="m">${esc(fmtDate(o.date))} · ${esc(payLabel(o.pay))}${o.type === 'Перевод' && o.payTo ? ' → ' + esc(payLabel(o.payTo)) : ''}${o.party ? ' · ' + esc(o.party) : ''} · ${esc(t('who'))}: ${esc(o.who)}${o.cancelled ? ' · <b>' + esc(t('cancelled')) + '</b>' : ''}</div>
          ${o.comment ? `<div class="m">${esc(o.comment)}</div>` : ''}
          ${o.edited ? `<div class="m">${esc(t('editedMark', { w: o.edited }))}</div>` : ''}
          ${(o.canEdit || o.canCancel) ? (S.confirmCancel === o.id
            ? `<div class="a"><b style="align-self:center">${esc(t('cancelQ'))}</b>
                <button class="chip" type="button" data-yes="${esc(o.id)}" style="border-color:var(--exp);color:var(--exp)">${esc(t('yesCancel'))}</button>
                <button class="chip" type="button" data-no="1">${esc(t('no'))}</button></div>`
            : `<div class="a">${o.canEdit ? `<button class="chip" type="button" data-edit="${esc(o.id)}">${esc(t('editRec'))}</button>` : ''}
                ${o.canCancel ? `<button class="chip" type="button" data-cancel="${esc(o.id)}">${esc(t('cancelRec'))}</button>
                ${isBoss() ? '' : `<span class="hint" style="align-self:center">${esc(t('cancelLeft', { m: left }))}</span>`}` : ''}</div>`) : ''}
        </div>`; }).join('') : `<div class="empty">${esc(t('empty'))}</div>`}
    </div>`, showHome);
  $app.querySelectorAll('[data-ft]').forEach(b => b.onclick = () => { S.histFilter = { type: b.dataset.ft || undefined }; showHistory(); });
  $app.querySelectorAll('[data-fc]').forEach(b => b.onclick = () => { S.histFilter = { type: f.type, cat: b.dataset.fc || undefined }; showHistory(); });
  $app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const o = items.find(x => x.id === b.dataset.edit); if (o) startEdit(o); });
  $app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { S.confirmCancel = b.dataset.cancel; renderHistory(); });
  $app.querySelectorAll('[data-no]').forEach(b => b.onclick = () => { S.confirmCancel = null; renderHistory(); });
  $app.querySelectorAll('[data-yes]').forEach(b => b.onclick = async () => {
    if (S.busy) return; S.busy = true;
    try { await api('cancel', { id: b.dataset.yes }); await showHistory(); }
    catch (e) { showError(e.code, showHistory, showHistory); }
    finally { S.busy = false; }
  });
}
function subLabel(o){ const a = S.ref.articles.find(x => x.type === o.type && x.cat === o.cat && x.sub === o.sub); return a ? subName(a) : o.sub; }

function periodDates(p){
  const today = S.ref.today;
  if (p === 'today') return [today, today];
  if (p === 'week') return [addDays(today, -6), today];
  if (p === 'month') return [today.slice(0, 8) + '01', today];
  return [S.rep.from || today.slice(0, 8) + '01', S.rep.to || today];
}

function reportBody(){

      <div class="kpi"><span>${esc(t('diffT'))}</span><b class="num ${tot.diff < 0 ? 'c-exp' : 'c-inc'}">${money(tot.diff)}</b><small>${esc(t('sum'))}</small></div>
    </div>
    <div class="side">
      <div><span>${esc(t('invT'))}</span><br><b class="num">${money(tot.invest)}</b> ${esc(t('sum'))}<br><small class="hint">${esc(t('notCounted'))}</small></div>
      <div><span>${esc(t('trT'))}</span><br><b class="num">${money(tot.transfer)}</b> ${esc(t('sum'))}<br><small class="hint">${esc(t('notCounted'))}</small></div>

  if (tab === 'dyn') {

    const card = (name, now, before, goodUp) => `<div><span class="n">${esc(name)}</span>

      <span class="num">${trend(now - before, before, goodUp)}</span></div>`;
    return `<p class="hint">${esc(t('comparedWith', { a: fmtDate(d.prevFrom), b: fmtDate(d.prevTo) }))}</p>
      <div class="dyn">${card(t('incT'), d.totals.income, p.income, true)}${card(t('expT'), d.totals.expense, p.expense)}</div>
      <h3>${esc(t('expT'))}</h3>
      <div class="dyn">${d.dynamics.map(x => card(catLabel('Расход', x.name), x.now, x.before)).join('')}</div>`;
  }
  return `<div class="tbl-wrap"><table><thead><tr><th></th><th>${esc(t('expT'))}</th><th>${esc(t('incT'))}</th></tr></thead><tbody>
    ${d.byPay.map(x => `<tr><td>${esc(payLabel(x.name))}</td><td class="num c-exp">${money(x.expense)}</td><td class="num c-inc">${money(x.income)}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function bars(title, list, type, color){
  if (!list.length) return '';
  const max = Math.max.apply(null, list.map(x => x.sum)) || 1;
  return `<h3>${esc(title)}</h3><div class="bars">${list.map(x => `
    <div class="bar-row"><span class="n">${esc(catLabel(type, x.name))}</span><span class="v num">${money(x.sum)} · ${Math.round(x.share * 100)}%</span>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(1, x.sum / max * 100)}%;background:${color}"></div></div></div>`).join('')}</div>`;
}
// Рост расходов — красным, рост доходов — зелёным
function trend(diff, before, goodUp){
  if (!diff) return esc(t('same'));
  const cls = (diff > 0) === !!goodUp ? 'down' : 'up';
  if (!before) return `<span class="${cls}">+${money(diff)} (${esc(t('newCat'))})</span>`;
  const pct = Math.round(Math.abs(diff) / before * 100);
  return diff > 0 ? `<span class="${cls}">+${money(diff)} · ${esc(t('grew'))} ${pct}%</span>`
                  : `<span class="${cls}">−${money(-diff)} · ${esc(t('fell'))} ${pct}%</span>`;
}

start();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {}));
</script>
